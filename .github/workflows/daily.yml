name: Daily Hindi explainers
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      VISIBILITY: private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - run: python main.py short 0
      - run: python main.py short 1
      - run: python main.py long 2
